name: Mimir Nest Repository Manager

on:
  issues:
    types: [opened, closed, reopened]

  pull_request_target:
    types: [opened, closed, reopened, labeled, unlabeled]

  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
      - name: Manage repository activity
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MIMIR_KEEPER_TOKEN }}

          script: |
            const { owner, repo } = context.repo;
            const event = context.eventName;
            const payload = context.payload;

            async function addLabel(issue_number, label) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label]
                });
              } catch (error) {
                console.log(
                  `Could not add label "${label}": ${error.message}`
                );
              }
            }

            async function removeLabel(issue_number, label) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label
                });
              } catch {}
            }

            async function comment(issue_number, body) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

            // --------------------------------------------------
            // Issues
            // --------------------------------------------------

            if (event === "issues") {
              const issue = payload.issue;

              if (payload.action === "opened") {
                await addLabel(issue.number, "triage");

                await comment(
                  issue.number,
                  [
                    "## Thank you for opening an issue",
                    "",
                    `Thank you @${issue.user.login} for helping improve **Mimir Nest**.`,
                    "",
                    "A maintainer will review this issue and determine the appropriate next step.",
                    "",
                    "Please make sure the issue contains enough information to reproduce or understand the problem."
                  ].join("\n")
                );
              }

              if (payload.action === "reopened") {
                await addLabel(issue.number, "triage");
              }

              if (payload.action === "closed") {
                await removeLabel(issue.number, "triage");
              }

              return;
            }

            // --------------------------------------------------
            // Pull Requests
            // --------------------------------------------------

            if (event === "pull_request_target") {
              const pr = payload.pull_request;
              const number = pr.number;

              if (payload.action === "opened") {
                await addLabel(number, "awaiting review");

                await comment(
                  number,
                  [
                    "## Thank you for your contribution",
                    "",
                    `Thanks @${pr.user.login} for opening a pull request for **Mimir Nest**.`,
                    "",
                    "The contribution has been received and is now awaiting maintainer review.",
                    "",
                    "Before review, please make sure:",
                    "",
                    "- The change follows the contribution guidelines.",
                    "- The project builds successfully.",
                    "- Related issues are referenced where applicable.",
                    "- The pull request clearly explains what changed and why."
                  ].join("\n")
                );
              }

              if (payload.action === "reopened") {
                await addLabel(number, "awaiting review");
              }

              if (
                payload.action === "closed" &&
                pr.merged === true
              ) {
                await removeLabel(number, "awaiting review");
                await addLabel(number, "merged");

                await comment(
                  number,
                  [
                    "## Pull Request Merged",
                    "",
                    `Thank you @${pr.user.login}!`,
                    "",
                    "Your contribution has been successfully merged into **Mimir Nest**.",
                    "",
                    "We appreciate the time and effort you put into improving the project."
                  ].join("\n")
                );
              }

              if (
                payload.action === "closed" &&
                pr.merged === false
              ) {
                await removeLabel(number, "awaiting review");
              }

              return;
            }

            // --------------------------------------------------
            // Maintainer Commands
            // --------------------------------------------------

            if (event === "issue_comment") {
              const commentBody =
                payload.comment.body.trim().toLowerCase();

              const issue = payload.issue;
              const author = payload.comment.user.login;

              const permission =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: author
                });

              const allowed = [
                "admin",
                "maintain",
                "write"
              ];

              if (
                !allowed.includes(
                  permission.data.user.permission
                )
              ) {
                return;
              }

              // /triage
              if (commentBody === "/triage") {
                await addLabel(
                  issue.number,
                  "triage"
                );

                await comment(
                  issue.number,
                  "Issue marked for **triage**."
                );
              }

              // /review
              if (commentBody === "/review") {
                await addLabel(
                  issue.number,
                  "awaiting review"
                );

                await comment(
                  issue.number,
                  "Marked as **awaiting review**."
                );
              }

              // /merged
              if (commentBody === "/merged") {
                await removeLabel(
                  issue.number,
                  "awaiting review"
                );

                await addLabel(
                  issue.number,
                  "merged"
                );

                await comment(
                  issue.number,
                  "Marked as **merged**."
                );
              }

              // /close
              if (commentBody === "/close") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed"
                });
              }

              // /reopen
              if (commentBody === "/reopen") {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "open"
                });
              }
            }
