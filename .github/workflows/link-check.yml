name: External Link Checker

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays at 00:00 UTC
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: link-check
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Scan Resource Files for Broken Links
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --timeout 10
            --max-retries 3
            --retry-wait-time 5
            --max-concurrency 10
            --accept "200..299,429"
            "apps/web-next/public/content/**/*.json"
          fail: false
          output: ./lychee-out.md

      - name: Prepend Date and Metadata to Report
        run: |
          if [ -f "./lychee-out.md" ]; then
            echo -e "### Automated Link Check Report\n**Date Checked:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')\n\n$(cat ./lychee-out.md)" > ./lychee-out-temp.md
            mv ./lychee-out-temp.md ./lychee-out.md
          fi

      - name: Publish Summary to Action Run
        run: |
          if [ -f "./lychee-out.md" ]; then
            cat ./lychee-out.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create or Update GitHub Issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search for an existing open issue with the title "Broken Link Report"
          ISSUE_NUMBER=$(gh issue list --state open --search "Broken Link Report" --repo ${{ github.repository }} --json number --jq '.[0].number')
          
          if [ -n "$ISSUE_NUMBER" ]; then
            echo "Updating existing issue #$ISSUE_NUMBER"
            gh issue edit "$ISSUE_NUMBER" --title "Broken Link Report" --body-file ./lychee-out.md --repo ${{ github.repository }}
          else
            echo "Creating new issue"
            gh issue create --title "Broken Link Report" --body-file ./lychee-out.md --repo ${{ github.repository }}
          fi
